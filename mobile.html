function sync(pull=false){let u=document.getElementById('url').value.trim()||localStorage.getItem(SYNC);if(!u)return alert('Configurez l’URL serveur.');document.getElementById('state').textContent='Synchronisation…';if(pull){let cb='bdm_cb_'+Date.now();window[cb]=x=>{try{if(!x.ok)throw Error(x.error||'Erreur');if(confirm('Remplacer les données locales ?')){db=x.data;save();document.getElementById('state').textContent='Synchronisé ✓'}}finally{delete window[cb];s.remove()}};let s=document.createElement('script');s.src=u+(u.includes('?')?'&':'?')+'callback='+cb;s.onerror=()=>{alert('Chargement impossible.');s.remove();delete window[cb]};document.body.appendChild(s)}else{let f=document.createElement('form');f.method='POST';f.action=u;f.target='syncFrame';let i=document.createElement('input');i.name='payload';i.value=JSON.stringify({version:3,data:db});f.appendChild(i);document.body.appendChild(f);f.submit();f.remove();setTimeout(()=>document.getElementById('state').textContent='Envoi terminé ✓',1200)}}
